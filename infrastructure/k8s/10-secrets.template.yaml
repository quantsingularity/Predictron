# Template only, this file's placeholder values are safe to commit;
# nothing here is a real credential. Before applying, either:
#
# 1. Copy this file, fill in real values, and apply the copy (then make
# sure the copy is gitignored, see the note at the bottom), or
# 2. Generate it directly without ever writing secrets to disk:
#
# kubectl create secret generic predictron-secrets \
# --namespace predictron \
# --from-literal=DATABASE_URL='postgresql://...' \
# --from-literal=SESSION_JWT_SECRET="$(openssl rand -hex 32)" \
# --dry-run=client -o yaml | kubectl apply -f -
#
# For a real production cluster, prefer External Secrets Operator or
# Sealed Secrets over either of the above, this file is the "get running
# on any cluster today" path, not the recommended long-term one.

apiVersion: v1
kind: Secret
metadata:
  name: predictron-secrets
  namespace: predictron
type: Opaque
stringData:
  DATABASE_URL: "postgresql://predictron:CHANGE_ME@postgres:5432/predictron"
  SESSION_JWT_SECRET: "CHANGE_ME_32_PLUS_RANDOM_CHARS"
  POSTGRES_PASSWORD: "CHANGE_ME"

# If you copy this file with real values filled in, name the copy
# something like secrets.local.yaml and add that pattern to a
# .gitignore in this directory, never commit the filled-in version.
