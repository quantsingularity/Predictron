# Template only, placeholder values are safe to commit. Generate a real
# one without writing secrets to disk:
#
# kubectl create secret generic predictron-secrets --namespace predictron \
#   --from-literal=DATABASE_URL='postgresql://...' \
#   --from-literal=SESSION_JWT_SECRET="$(openssl rand -hex 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -

apiVersion: v1
kind: Secret
metadata:
  name: predictron-secrets
  namespace: predictron
type: Opaque
stringData:
  DATABASE_URL: "postgresql://predictron:CHANGE_ME@postgres:5432/predictron"
  SESSION_JWT_SECRET: "CHANGE_ME_32_PLUS_RANDOM_CHARS"
  POSTGRES_PASSWORD: "CHANGE_ME"
# If you copy this file with real values, gitignore the copy.
