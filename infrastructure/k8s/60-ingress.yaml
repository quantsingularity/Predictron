# Written against ingress-nginx + cert-manager, the most common combo and
# available on any cluster (managed or self-hosted), swap the
# ingressClassName and cert-manager annotation for your cluster's
# equivalents if different (e.g. AWS ALB, GKE's native Ingress).
#
# This is the only manifest in this directory that exposes anything
# outside the cluster. Every other Service in infrastructure/k8s is
# ClusterIP-only, and there is exactly one Ingress, pointed at exactly one
# Service (frontend), the same "one public door" shape as
# infrastructure/nginx/frontend.nginx.conf in the Docker Compose setup.
# The frontend's own nginx handles the /api/ split internally (proxying to
# the "backend" Service's in-cluster DNS name), so this Ingress only ever
# needs a single rule.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predictron
  namespace: predictron
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.predictron.example"]
      secretName: predictron-tls
  rules:
    - host: app.predictron.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
