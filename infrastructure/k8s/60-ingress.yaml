# Written against ingress-nginx + cert-manager; swap for your cluster's
# equivalents if different. The only manifest exposing anything outside
# the cluster; the frontend's nginx handles the /api/ split internally.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predictron
  namespace: predictron
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["app.predictron.example"]
      secretName: predictron-tls
  rules:
    - host: app.predictron.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
