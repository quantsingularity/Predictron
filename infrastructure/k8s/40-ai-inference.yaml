# No external exposure; only the backend reaches this, over the
# cluster-internal DNS name "ai-inference".

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-inference
  namespace: predictron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-inference
  template:
    metadata:
      labels:
        app: ai-inference
    spec:
      containers:
        - name: ai-inference
          image: ghcr.io/OWNER/predictron-ai-inference:latest
          ports:
            - containerPort: 8000
          env:
            - name: BACKEND_ORIGIN
              value: "http://backend:4000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: ai-inference
  namespace: predictron
spec:
  type: ClusterIP
  selector:
    app: ai-inference
  ports:
    - port: 8000
      targetPort: 8000
