server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any path that doesn't match a real static file (e.g.
    # /dashboard/staking on a hard refresh) serves index.html so React
    # Router's client-side routing can take over, instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the backend container, which has no published host
    # port of its own in the "prod" compose profile — this is the only
    # path into it from outside the docker network.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
